[project]
name = "b1k-solution"
version = "0.1.0"
description = "BEHAVIOR-1K solution based on OpenPI"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "openpi",
    "future==1.0.0",
    "jax[cuda12]==0.4.35",
    "jaxlib==0.4.35",
    "flax==0.10.4",
    "jaxtyping==0.2.34",
    "numpy==1.26.4",
    "typeguard>=4.0.0",
    "pytest",
    "torch==2.6.0",         # lerobot 0.4.4와 호환되는 버전
    "torchvision==0.21.0",
    "tyro>=0.9.12",
    "pydantic>=2.10.3",
    "opencv-python>=4.10.0",
    "joblib>=1.4.2",
    "matplotlib>=3.10.0",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
    "numpydantic>=1.7.0",
    "einops>=0.8.0",
    "etils>=1.10.0",
    "websockets>=14.1",
    "orbax-checkpoint==0.11.13",
    "tqdm-loggable>=0.2",
    "lerobot==0.4.4",       # 3.11에서 돌아가는 마지막 안정 버전
    "wandb>=0.18.0",
    "gpustat>=1.1.1",
    "huggingface-hub[cli]>=0.20.0",
    "addict>=2.4.0",
    "h5py>=3.16.0",
    "transforms3d>=0.4.2",
    "numba>=0.65.0",
    "ipython>=9.10.1",
    "ipywidgets>=8.1.8",
    "tqdm>=4.67.3",
    "trimesh>=4.11.5",
    "networkx>=3.6.1",
    "pyyaml>=6.0.3",
    "open3d>=0.19.0",
    "aenum>=3.1.17",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "chex>=0.1.90",
    "optax>=0.2.8",
    "augmax>=0.4.1",
    "beartype>=0.22.9",
    "transformers==4.53.2",
    "sentencepiece>=0.2.0",
    "dm-tree>=0.1.8",
    "equinox>=0.11.8",
    "ml-collections==1.0.0",
    "treescope>=0.1.7",
    "rich>=14.0.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
extra-index-url = ["https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"]
override-dependencies = [
    "jax==0.4.35",
    "jaxlib==0.4.35",
    "flax==0.10.4",
    "jaxtyping==0.2.34",
    "typeguard>=4.0.0",
    "orbax-checkpoint==0.11.13",
    "numpy==1.26.4",
    "future==1.0.0",
    "pytest"
]
